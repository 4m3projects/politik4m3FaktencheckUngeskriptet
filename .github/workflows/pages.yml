# Erzeugt die statische Webseite aus den Faktencheck-Daten und veröffentlicht sie über GitHub Pages.
# Pull Requests: nur Prüfung und Testaufbau, keine Veröffentlichung.
# Push auf main: Prüfung, Aufbau und Veröffentlichung.
# Es werden ausschließlich die Seitendateien aus site/ (ohne *-test.js), eigene Markdown-Berichte, die beiden
# strukturierten JSON-Dateien, video.json und rhetorik.json je Video sowie faktenchecks/beziehungen.json übernommen –
# keine anderen Dateien aus dem Repository.
name: Webseite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test-Factcheck.ps1 nutzt feste Referenzcommits aus der Historie des Schwesterprojekts, aus dem die Daten
      # stammen. Nur Git-Objekte laden; Arbeitsbaum, Index und Branches bleiben unveraendert.
      - name: Referenzstaende aus dem Schwesterprojekt laden
        run: git fetch --no-tags https://github.com/4m3projects/politik4m3Facktencheck main

      - name: Publikationsprüfung
        shell: pwsh
        run: ./scripts/Test-Publication.ps1

      - name: Faktencheck-Regressionstests (PowerShell 7)
        shell: pwsh
        run: ./scripts/Test-Factcheck.ps1

      - name: Generator-Prüfmodus je Video
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem -Directory faktenchecks) {
            if (Test-Path (Join-Path $dir.FullName 'strukturiert/aussagen.json')) {
              Write-Host "Build-Factcheck -Check: $($dir.Name)"
              ./scripts/Build-Factcheck.ps1 -VideoId $dir.Name -Check
            }
          }

      - name: Synchronisationslogik testen
        run: node --test site/sync-test.js

      - name: Originale, Reaktionen und Beziehungen prüfen
        run: node --test site/relations-test.js

      - name: Rhetorik-Ebene prüfen (getrennt von der Faktenbewertung)
        run: node --test site/rhetoric-test.js

      - name: Faktenampel prüfen (zentrale Regel, nur aus Aussagebewertungen)
        run: node --test site/ampel-test.js

      - name: Webseite zusammenstellen
        env:
          OUT: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/daten"
          cp site/index.html site/style.css site/app.js site/sync.js site/video.js site/relations.js site/rhetoric.js site/ampel.js "$OUT/"
          # Versionsparameter je Commit: Browser und GitHub-Pages-Cache laden nach jedem Deploy alle Skripte neu
          # und mischen keine alten und neuen Dateien.
          ver="${GITHUB_SHA:0:12}"
          sed -i -E "s#(src|href)=\"(style\.css|app\.js|sync\.js|video\.js|relations\.js|rhetoric\.js|ampel\.js)\"#\1=\"\2?v=${ver}\"#g" "$OUT/index.html"
          test "$(grep -c "?v=${ver}" "$OUT/index.html")" -eq 7
          if [[ -f faktenchecks/beziehungen.json ]]; then jq -c . faktenchecks/beziehungen.json > "$OUT/daten/beziehungen.json"; else echo '{"schemaVersion":1,"relations":[]}' > "$OUT/daten/beziehungen.json"; fi
          videos='[]'
          for dir in faktenchecks/*/; do
            id=$(basename "$dir")
            [[ "$id" =~ ^[A-Za-z0-9_-]{11}$ ]] || continue
            [[ -f "$dir/README.md" ]] || continue
            mkdir -p "$OUT/daten/$id"
            files=$(cd "$dir" && find . -type f -name '*.md' | sed 's|^\./||' | LC_ALL=C sort)
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              mkdir -p "$OUT/daten/$id/$(dirname "$f")"
              cp "$dir/$f" "$OUT/daten/$id/$f"
            done <<< "$files"
            structured=false
            if [[ -f "$dir/strukturiert/aussagen.json" ]]; then
              structured=true
              mkdir -p "$OUT/daten/$id/strukturiert"
              jq -c . "$dir/strukturiert/aussagen.json" > "$OUT/daten/$id/strukturiert/aussagen.json"
              if [[ -f "$dir/strukturiert/statistik.json" ]]; then
                jq -c . "$dir/strukturiert/statistik.json" > "$OUT/daten/$id/strukturiert/statistik.json"
              fi
            fi
            meta=null
            if [[ -f "$dir/video.json" ]]; then meta=$(jq -c . "$dir/video.json"); fi
            rhetoric=false
            if [[ -f "$dir/rhetorik.json" ]]; then
              rhetoric=true
              jq -c . "$dir/rhetorik.json" > "$OUT/daten/$id/rhetorik.json"
            fi
            title=$(grep -m1 '^# ' "$dir/README.md" | sed 's/^# //')
            videos=$(jq -c --arg id "$id" --arg title "${title:-$id}" --argjson structured "$structured" --argjson rhetoric "$rhetoric" --argjson meta "$meta" \
              --argjson files "$(printf '%s\n' "$files" | jq -R . | jq -sc 'map(select(length > 0))')" \
              '. + [{id: $id, title: $title, structured: $structured, rhetoric: $rhetoric, files: $files, video: $meta}]' <<< "$videos")
          done
          jq -n --argjson videos "$videos" \
            --arg commit "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generated: $generated, commit: $commit, repository: $repository, videos: $videos}' > "$OUT/daten/index.json"
          echo "Videos: $(jq '.videos | length' "$OUT/daten/index.json")"
          find "$OUT" -type f | sort

      - name: Seitenartefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
